{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content-area">

    <h1 class="page-title">Gestion des Promotions et Groupes</h1>

    <!-- FORMULAIRES -->
    <div class="form-grid">

        <!-- FORM PROMOTION -->
        <div class="form-card">
            <form id="formPromo">
                <h2>Nouvelle Promotion</h2>

                <div class="form-group">
                    <label for="promoNom">Nom</label>
                    <input type="text" id="promoNom" class="input-filter" placeholder="Ex : L3 Info" required>
                </div>

                <div class="form-group">
                    <label for="promoAnnee">Année</label>
                    <input type="text" id="promoAnnee" class="input-filter" placeholder="Ex : 2025-2026" required>
                </div>

                <button type="submit" class="btn-action full-width">Créer Promotion</button>
            </form>
        </div>

        <!-- FORM GROUPE -->
        <div class="form-card">
            <form id="formGroupe">
                <h2>Nouveau Groupe</h2>

                <div class="form-group">
                    <label for="selectPromoForGroupe">Promotion</label>
                    <select id="selectPromoForGroupe" class="input-filter" required>
                        <option value="">-- Sélectionner une promotion --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="groupeNom">Nom du groupe</label>
                    <input type="text" id="groupeNom" class="input-filter" placeholder="Ex : Groupe A" required>
                </div>

                <button type="submit" class="btn-action full-width">Créer Groupe</button>
            </form>
        </div>

    </div>

    <!-- TABLEAU DES PROMOTIONS -->
    <div class="table-container" style="margin-top: 30px;">
        <div class="table-header">
            <h2>Liste des Promotions</h2>
        </div>

        <table id="tablePromotions">
            <thead>
                <tr>
                    <th>NOM</th>
                    <th>ANNÉE</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

</div>

<script src="{% static 'etudiants/js/promotions.js' %}"></script>
{% endblock %}
