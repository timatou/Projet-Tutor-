{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Mon Espace Enseignant</h2>
    </div>

    {% if has_modules %}
        <div class="row">
            {% for m in modules %}
            <div class="col-md-4 mb-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-primary">{{ m.libelle }}</h5>
                        <p class="text-muted small">{{ m.code }}</p>
                        <hr>
                        <div class="d-grid gap-2">
                            <a href="{% url 'saisir_notes_module' m.id %}" class="btn btn-sm btn-outline-success">
                            <i class="fas fa-edit me-1"></i> Saisir les notes
                            </a>
                            <a href="{% url 'faire_appel_module' m.id %}" class="btn btn-sm btn-outline-warning">
                            <i class="fas fa-user-check me-1"></i> Faire l'appel
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="alert alert-warning shadow-sm border-0">
            <i class="fas fa-exclamation-triangle me-2"></i>
            Vous n'êtes assigné à aucun module pour le moment.
        </div>
    {% endif %}
</div>
{% endblock %}
