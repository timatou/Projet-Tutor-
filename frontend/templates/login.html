<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Suivi Étudiants</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <i class="fas fa-user-graduate"></i>
        <h1>Suivi des Étudiants</h1>
        <p>Connectez-vous pour accéder à votre tableau de bord</p>
      </div>
      <form action="dashboard.html">
        <div class="form-group">
          <label>Identifiant</label>
          <input type="text" required placeholder="Entrez votre identifiant">
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" required placeholder="Entrez votre mot de passe">
        </div>
        <button type="submit" class="btn-login">Se connecter</button>
      </form>
      <div class="login-footer">
        <p>© 2025 Université Toulouse 2 - Jean Jaurès</p>
      </div>
    </div>
  </div>
