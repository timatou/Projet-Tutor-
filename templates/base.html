{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion Scolaire{% endblock %}</title>
    <link rel="icon" href="data:,">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block styles %}{% endblock %}
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Suivi Étudiants</h2>
      </div>
      <nav class="menu">
        <a href="#" class="menu-item"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a href="{% url 'liste_enseignants' %}" class="menu-item"><i class="fas fa-chalkboard-teacher"></i> Enseignants</a>
        <a href="{% url 'liste_etudiants' %}" class="menu-item"><i class="fas fa-users"></i> Étudiants</a>
        <a href="{% url 'liste_modules' %}" class="menu-item"><i class="fas fa-book"></i> Modules</a>
        <a href="{% url 'liste_notes' %}" class="menu-item"><i class="fas fa-clipboard-list"></i> Notes</a>
        <a href="{% url 'liste_absences' %}" class="menu-item"><i class="fas fa-calendar-times"></i> Absences</a>
        <a href="{% url 'liste_statistiques' %}" class="menu-item"><i class="fas fa-chart-bar"></i> Statistiques</a>


        </nav>
    </aside>
    
    <!-- CONTENU PRINCIPAL -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
