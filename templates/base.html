{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion Scolaire{% endblock %}</title>

    <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">-->

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}"> 

    {% block styles %}{% endblock %}
</head>

<body>

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Suivi Étudiants</h2>
      </div>
      <nav class="menu">
        <a href="#" class="menu-item"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a href="{% url 'liste_etudiants' %}" class="menu-item"><i class="fas fa-users"></i> Étudiants</a>
        <a href="{% url 'liste_modules' %}" class="menu-item"><i class="fas fa-book"></i> Modules</a>
        <a href="{% url 'liste_notes' %}" class="menu-item"><i class="fas fa-clipboard-list"></i> Notes</a>
        <a href="{% url 'liste_absences' %}" class="menu-item"><i class="fas fa-calendar-times"></i> Absences</a>

      </nav>
    </aside>

<!-- CONTENU PRINCIPAL -->
<main class="main-content">
    <div class="container-fluid py-4">
        {% block content %}
        {% endblock %}
    </div>
</main>

<!-- JS Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
{% block scripts %}{% endblock %}
</body>
</html>
